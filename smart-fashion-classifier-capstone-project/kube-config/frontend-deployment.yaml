apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: fashion-frontend:v1
          env:
            - name: GATEWAY_URL
              value: "http://gateway:80/predict"
          ports:
            - containerPort: 8501
          resources:
            limits:
              memory: "1Gi"
            requests:
              memory: "512Mi"
