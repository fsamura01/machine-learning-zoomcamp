apiVersion: apps/v1
kind: Deployment
metadata:
  name: tf-serving-model
  labels:
    app: model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tf-serving-model
  template:
    metadata:
      labels:
        app: tf-serving-model
    spec:
      containers:
      - name: tf-serving-model
        image: clothing-model:v1
        ports:
        - containerPort: 8500
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        