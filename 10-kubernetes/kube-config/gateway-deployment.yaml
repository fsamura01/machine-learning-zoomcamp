apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: clothing-model-gateway:001
        resources:
          limits:
            memory: "512Mi"    # Changed from 128Mi
            cpu: "500m"        # Changed from 100m
          requests:
            memory: "256Mi"    # Added requests
            cpu: "200m"        # Added requests
        ports:
        - containerPort: 9696
        env:
          - name: TF_SERVING_HOST
            value: tf-serving-clothing-model.default.svc.cluster.local:8500